
apiVersion: apps/v1
kind: Deployment

metadata:
  name: health-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: health-app

  template:
    metadata:
      labels:
        app: health-app

    spec:
      containers:
        - name: health-container
          image: health-app:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          livenessProbe:
            httpGet:
              path: /live
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
