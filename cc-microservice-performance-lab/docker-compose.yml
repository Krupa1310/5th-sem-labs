services:

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5001:5001"
    networks:
      - microservice-network

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5002:5002"
    networks:
      - microservice-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5000:5000"
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge


