# Permissions for the dashboard pod. It may READ pods/endpoints/events and
# PATCH the health-demo Deployment (for the slow start-up scenario) - nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: health-dashboard
rules:
- apiGroups: [""]
  resources: ["pods", "endpoints", "events", "services"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: health-dashboard
subjects:
- kind: ServiceAccount
  name: health-dashboard
roleRef:
  kind: Role
  name: health-dashboard
  apiGroup: rbac.authorization.k8s.io
