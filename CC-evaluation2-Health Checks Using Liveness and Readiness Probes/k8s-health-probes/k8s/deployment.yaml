# Sample application: 3 replicas, each with a liveness and a readiness probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-demo
  labels:
    app: health-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: health-demo
  # Rolling update settings used by the "Slow Startup" demo:
  # all 3 new pods are created at once (maxSurge 100%) and the old pods are kept
  # until the new ones are Ready (maxUnavailable 0). So you can watch new pods sit
  # at 0/1 for ~30 s while the old pods keep serving traffic.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: health-demo
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: health-demo
        image: health-demo:1.0
        imagePullPolicy: IfNotPresent      # use the locally built image
        ports:
        - containerPort: 5000
        env:
        - name: POD_NAME                    # lets the app report its own pod name
          valueFrom:
            fieldRef: {fieldPath: metadata.name}
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        - name: STARTUP_DELAY_SECONDS       # 0 = normal. The dashboard sets this to 30
          value: "0"                        # to simulate a slow start-up.
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 128Mi}
        # LIVENESS: failing 3 times in a row (3 x 5 s = ~15 s) => container restarted
        livenessProbe:
          httpGet: {path: /healthz, port: 5000}
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        # READINESS: failing => pod removed from Service endpoints (NO restart)
        readinessProbe:
          httpGet: {path: /ready, port: 5000}
          initialDelaySeconds: 3
          periodSeconds: 5
