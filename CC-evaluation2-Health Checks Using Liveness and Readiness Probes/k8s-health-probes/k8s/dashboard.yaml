# Monitoring dashboard: runs inside the cluster so it can talk to the Kubernetes API
# and directly to each pod's IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-dashboard
  labels:
    app: health-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-dashboard
  template:
    metadata:
      labels:
        app: health-dashboard
    spec:
      serviceAccountName: health-dashboard
      terminationGracePeriodSeconds: 5
      containers:
      - name: dashboard
        image: health-dashboard:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: TARGET_DEPLOYMENT
          value: health-demo
        - name: TARGET_SERVICE
          value: health-demo-svc
        - name: TARGET_LABEL
          value: app=health-demo
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 128Mi}
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: health-dashboard
  labels:
    app: health-dashboard
spec:
  type: NodePort
  selector:
    app: health-dashboard
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30090
