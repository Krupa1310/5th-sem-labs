# Exposes the sample app. A Service only sends traffic to pods that are READY,
# so a pod failing its readiness probe disappears from this Service's endpoints.
apiVersion: v1
kind: Service
metadata:
  name: health-demo-svc
  labels:
    app: health-demo
spec:
  type: NodePort
  selector:
    app: health-demo
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30080
